<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Product Catalog</title>
</head>
<body>

    <h1>Welcome to Our Store</h1>
    <h2>Best Sellers</h2>

    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li><strong>Carrots</strong></li>
    </ul>

    <img id="apple-image" src="apple.jpg" alt="A fresh red apple" width="100">
    <img id="banana-image" src="banana.jpg" alt="A bunch of ripe bananas" width="200">

    <img src="logo.png" alt="Company Store Logo" width="50">

    <a href="index.html">Back to Home</a>

    <form>
        <p>
            <label for="name">Name:</label>
            <input type="text" name="user_name" id="name">
        </p>

        <p>
            <label for="address">Enter Address:</label>
            <input type="text" name="user_address" id="address">
        </p>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
